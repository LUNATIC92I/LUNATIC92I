global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lunatic-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Per-worker and per-datastore exporters (postgres_exporter, redis_exporter,
# OpenSearch monitoring) are added as those components ship metrics
# (Phase 16 — Observability).
