# Redis HA via the Bitnami redis Helm chart's built-in Sentinel mode —
# real, load-bearing production topology (automatic master election,
# replica promotion on failure), not something worth hand-rolling when a
# well-established chart already does it correctly.
#
# Install:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm install redis bitnami/redis -n lunatic-data \
#     -f kubernetes/data-tier/values-redis-ha.yaml
#
# Making the app follow a failover automatically: every backend Redis
# client (`RedisStreamsEventBus` and everything using `get_redis()`
# alike — backend/app/core/redis.py::build_redis_client()) is
# Sentinel-aware. Set these two on every backend deployment/configmap to
# enable it:
#   REDIS_SENTINEL_HOSTS=redis-sentinel.lunatic-data.svc.cluster.local:26379
#   REDIS_SENTINEL_SERVICE_NAME=mymaster   # the masterSet value below
# With those set, the client builds through redis-py's own `Sentinel`
# class (`Sentinel(...).master_for("mymaster")`) instead of a bare
# `redis.asyncio.from_url()`, and re-resolves the current master on every
# command rather than remembering whichever pod was master when the
# process started — so a promotion needs no worker restart. Left unset
# (the default, matching docker-compose's single Redis node), every
# client falls back to a plain `REDIS_URL` connection exactly as before
# this setting existed. Verified directly against a real local cluster:
# the actual master container killed mid-run, the same client continuing
# to serve requests against the promoted replica once Sentinel's own
# detection window elapsed, with data written both before and after the
# kill confirmed present on the new master.
architecture: replication
auth:
  enabled: true
  existingSecret: redis-auth
  existingSecretPasswordKey: password

sentinel:
  enabled: true
  masterSet: mymaster
  quorum: 2
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

replica:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    size: 8Gi
  # Never 2 of the 3 data-bearing pods (1 former-master-turned-replica +
  # 2 replicas, across the StatefulSet) on the same node — the whole
  # point of replication is surviving a single node's failure.
  podAntiAffinityPreset: hard

master:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    size: 8Gi

networkPolicy:
  # kubernetes/data-tier/networkpolicy.yaml already covers this namespace
  # with its own default-deny + explicit allows; avoid a second,
  # potentially conflicting set of NetworkPolicy objects from the chart.
  enabled: false

metrics:
  enabled: true
