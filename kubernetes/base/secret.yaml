# EXAMPLE ONLY — every value below is a dev-only placeholder, the same
# convention as .env.example and the CI workflows' "ci-test-only-password"
# style dummies. This manifest exists so `kubectl apply -k` produces a
# working dev/kind cluster out of the box; it must never be applied as-is
# to a real environment.
#
# In production, do not commit real secrets to a Secret manifest at all —
# use External Secrets Operator, Sealed Secrets, or your cloud provider's
# secret store (AWS Secrets Manager / GCP Secret Manager / Azure Key Vault)
# to materialize this Secret object from a source that is never in git.
# Whatever mechanism you use, keep the key names below unchanged: the
# Deployments in this directory reference them by name.
apiVersion: v1
kind: Secret
metadata:
  name: lunatic-secrets
  namespace: lunatic-siem
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE-ME-generate-with-python-secrets-token-urlsafe-64"
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  MFA_ENCRYPTION_KEY: "REPLACE-ME-generate-a-real-fernet-key-see-comment-above"
  # Full connection strings — Settings reads these directly, never
  # host/port pieces (app/core/config.py). Both point into `lunatic-data`
  # (kubernetes/data-tier/), never colocated with the app tier.
  #
  # `postgres-rw` is the read-write Service CloudNativePG creates
  # automatically for a Cluster named "postgres" — it always routes to
  # the current primary, so a failover never requires changing this URL.
  DATABASE_URL: "postgresql+asyncpg://lunatic:REPLACE-ME@postgres-rw.lunatic-data.svc.cluster.local:5432/lunatic_siem"
  # `redis-master` is the Bitnami chart's master Service. See the gap
  # documented at the top of values-redis-ha.yaml: this static address
  # does NOT itself follow a Sentinel failover yet — that needs either a
  # failover-aware proxy in front of it or a code change to
  # RedisStreamsEventBus, tracked there, not silently assumed solved here.
  REDIS_URL: "redis://:REPLACE-ME@redis-master.lunatic-data.svc.cluster.local:6379/0"
  OPENSEARCH_PASSWORD: "REPLACE-ME"
