apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lunatic-siem
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: lunatic-siem
spec:
  replicas: 2
  # Zero-downtime rollout: never fewer than 2 ready pods behind the
  # Service while a new version comes up (maxSurge adds a 3rd before any
  # of the 2 originals is removed).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: lunatic-siem
    spec:
      serviceAccountName: lunatic-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # uvicorn's own graceful shutdown drains in-flight requests on
      # SIGTERM; give it real room before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: lunatic-siem-backend:latest
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: lunatic-config
            - secretRef:
                name: lunatic-secrets
          volumeMounts:
            - name: rules-authentication
              mountPath: /app/rules/authentication
              readOnly: true
            - name: rules-correlation
              mountPath: /app/rules/correlation
              readOnly: true
            - name: rules-windows
              mountPath: /app/rules/windows
              readOnly: true
            - name: playbooks
              mountPath: /app/playbooks
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # /health is a liveness check only — "is the process alive," not
          # "can it reach Postgres/Redis/OpenSearch." /ready (readiness)
          # is the one that pulls a pod out of the Service on a dependency
          # outage, so a downstream blip never turns into 502s for users
          # already load-balanced elsewhere (docs/OBSERVABILITY.md).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: rules-authentication
          configMap:
            name: rules-authentication
        - name: rules-correlation
          configMap:
            name: rules-correlation
        - name: rules-windows
          configMap:
            name: rules-windows
        - name: playbooks
          configMap:
            name: lunatic-playbooks
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lunatic-siem
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
  # No metrics port here on purpose — /metrics stays internal-only
  # (docs/OBSERVABILITY.md); Prometheus scrapes pods directly via
  # PodMonitor/pod discovery, never through this Service.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: lunatic-siem
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: lunatic-siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
