# Parser worker: events.raw -> parse -> OCSF normalize -> events.normalized.
# Horizontally scalable: consumers share one Redis Streams consumer group
# (CONSUMER_GROUP = "parser" in app/workers/parser_worker.py), so each raw
# event is handled exactly once across however many replicas are running —
# the Kubernetes-level scaling story here is "add more consumer group
# members," nothing k8s-specific to get right.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: lunatic-siem
  labels:
    app.kubernetes.io/name: parser
    app.kubernetes.io/part-of: lunatic-siem
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parser
        app.kubernetes.io/part-of: lunatic-siem
    spec:
      serviceAccountName: lunatic-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # A message in flight when SIGTERM arrives finishes its current
      # handle()/ack() cycle (app/workers/parser_worker.py's own stop
      # Event loop) rather than being cut off mid-processing; anything
      # still unacked when the pod is actually removed is picked up by
      # another replica's reclaim sweep (claim_stale) within
      # RECLAIM_MIN_IDLE_MS — no event is lost either way.
      terminationGracePeriodSeconds: 30
      containers:
        - name: parser
          image: lunatic-siem-backend:latest
          command: ["python", "-m", "app.workers.parser_worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: lunatic-config
            - secretRef:
                name: lunatic-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parser
  namespace: lunatic-siem
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parser
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: lunatic-siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parser
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
