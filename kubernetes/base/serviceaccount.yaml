apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunatic-backend
  namespace: lunatic-siem
  labels:
    app.kubernetes.io/part-of: lunatic-siem
# No cluster-role, no automounted API access beyond what every pod gets by
# default. Nothing here talks to the Kubernetes API — least privilege means
# not asking for the capability at all, not asking and then unused.
automountServiceAccountToken: false
