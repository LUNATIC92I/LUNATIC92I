# Indexer worker: events.normalized -> enrich -> OpenSearch. Also applies
# index templates/ILM policies at startup (idempotent — safe for every
# replica to do on every start, see app/services/index_management.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: lunatic-siem
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: lunatic-siem
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: lunatic-siem
    spec:
      serviceAccountName: lunatic-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: indexer
          image: lunatic-siem-backend:latest
          command: ["python", "-m", "app.workers.indexer_worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: lunatic-config
            - secretRef:
                name: lunatic-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: indexer
  namespace: lunatic-siem
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: indexer
  namespace: lunatic-siem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: indexer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
