name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pipeline order mirrors spec §31: lint -> type check -> unit tests ->
# dependency scan -> container scan -> build. Integration tests, the
# automated security-test suite (spec §30), and deploy are added as their
# owning phases land (see docs/DEVELOPMENT_PLAN.md, Phases 3+, 17, 20) —
# they are not stubbed here as always-green no-ops.

jobs:
  backend-lint-and-typecheck:
    name: Backend / lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: mypy .
        working-directory: backend

  backend-tests:
    name: Backend / unit + integration tests
    runs-on: ubuntu-latest
    needs: backend-lint-and-typecheck
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: lunatic
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: lunatic_siem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunatic -d lunatic_siem_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lunatic:ci-test-only-password@localhost:5432/lunatic_siem_test
      JWT_SECRET_KEY: ci-test-only-secret-not-for-production
      # A fixed, non-secret Fernet key used only to encrypt throwaway MFA
      # secrets created and destroyed within a single CI run.
      MFA_ENCRYPTION_KEY: BAXh6NR-CnCtWopK3oargngPR5TujRZgroL-3xioUI0=
      MAX_FAILED_LOGIN_ATTEMPTS: "3"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Enable required Postgres extensions
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect('${{ env.DATABASE_URL }}'.replace('postgresql+asyncpg', 'postgresql'))
          conn.autocommit = True
          conn.cursor().execute('CREATE EXTENSION IF NOT EXISTS pgcrypto')
          conn.close()
          "
        working-directory: backend
      - run: pytest -v
        working-directory: backend

  backend-security:
    name: Backend / bandit + pip-audit
    runs-on: ubuntu-latest
    needs: backend-lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: bandit -r app -c pyproject.toml
        working-directory: backend
      - run: pip-audit
        working-directory: backend

  frontend-lint-typecheck-build:
    name: Frontend / lint + type check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-and-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-typecheck-build]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          tags: lunatic-siem-${{ matrix.service }}:ci
          push: false
          load: true
      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: lunatic-siem-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
