[project]
name = "lunatic-siem-backend"
version = "0.1.0"
description = "LUNATIC-IT SIEM backend — API, pipeline workers, detection/correlation/risk engines."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.20,<1.21",
    "asyncpg>=0.31,<0.32",
    "psycopg2-binary>=2.9,<3.0",  # sync driver used by Alembic migrations only
    "httpx>=0.28,<0.29",
    "redis>=8.1,<9.0",
    # [async] pulls aiohttp, without which AsyncOpenSearch is not exported.
    "opensearch-py[async]>=3.2,<4.0",
    "prometheus-client>=0.26,<0.27",
    "python-json-logger>=4.2,<5.0",
    "PyYAML>=6.0,<7.0",
    # Detection rules match regexes against attacker-controlled log data.
    # `regex` is here for one feature the standard library does not have:
    # a per-match timeout. Without it a catastrophically-backtracking
    # pattern wedges the detection worker with no way to interrupt it
    # (app/detection/conditions.py).
    "regex>=2026.9,<2027.0",
    "argon2-cffi>=25.1,<26.0",
    "PyJWT>=2.14,<3.0",
    "pyotp>=2.10,<3.0",
    "cryptography>=50.0,<51.0",
    "email-validator>=2.2,<3.0",
    # XXE/entity-expansion-hardened XML parsing. A SIEM parses hostile XML
    # by definition (Windows Event Log), so stdlib ElementTree is not an
    # option here — see THREAT_MODEL.md §3.8.
    "defusedxml>=0.7.1,<0.8",
    # Distributed tracing (Phase 16). The OTLP/HTTP exporter only ever runs
    # when OTEL_EXPORTER_OTLP_ENDPOINT is set — see app/core/tracing.py —
    # same fail-closed-by-default shape as the egress guard.
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-sdk>=1.44,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3.0",
    "bandit[toml]>=1.9,<2.0",
    "pip-audit>=2.10,<3.0",
    "types-defusedxml>=0.7,<0.8",
    "types-PyYAML>=6.0,<7.0",
    "types-regex>=2026.9,<2027.0",
]
# Separate from `dev`: the load-testing harness (Phase 18, spec §24) pulls
# in a fair amount (gevent, flask, ...) that ordinary development, linting
# and the unit/integration suite never need.
perf = [
    "locust>=2.46,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.auth.dependencies.require_permission"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "S105", "S106", "S107", "E501"]
"alembic/versions/*" = ["E501"]  # autogenerated, not hand-formatted

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.bandit]
exclude_dirs = ["app/tests"]
