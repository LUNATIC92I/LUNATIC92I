rule_id: AUTH-002
name: Password spraying from a single source
description: >-
  One source address failing authentication against many distinct accounts
  in a short window. Spraying stays under per-account lockout thresholds by
  design, so counting failures per account (AUTH-001) will never see it —
  the threshold here counts DISTINCT usernames, not attempts.
severity: high
confidence: 80
risk_score: 75
status: enabled
version: 1
author: LUNATIC-IT Detection Engineering

conditions:
  all:
    - field: class
      operator: equals
      value: Authentication
    - field: authentication.outcome
      operator: equals
      value: failure

window:
  duration: 15m
  threshold: 10
  group_by:
    - source_ip
  distinct_field: user.name

suppress_by:
  - source_ip
suppression: 1h

mitre_attack:
  - T1110
  - T1110.003

false_positive_notes: >-
  A misconfigured proxy, VPN concentrator or NAT gateway presents many users
  behind one address, so a shared egress address can cross the distinct-user
  threshold from ordinary typos. Identify such addresses and except them
  explicitly (with an expiry) rather than lowering the threshold; a vulnerability
  scanner performing authenticated scans is the other recurring cause.
investigation_steps: >-
  1. List the distinct accounts the source touched — a machine-generated
  alphabetical or dictionary sequence is decisive.
  2. Check whether any of those accounts subsequently authenticated
  successfully from that address, or from anywhere unusual.
  3. Determine whether the address is internal (a compromised host spraying
  from inside) or external, and check it against threat intelligence.
  4. If any success is found, treat every account the source touched as
  potentially known-to-the-attacker and prioritise the successful one.
references:
  - https://attack.mitre.org/techniques/T1110/003/
