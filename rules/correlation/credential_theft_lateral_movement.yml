correlation_id: CORR-002
name: Credential dumping followed by lateral movement
description: >-
  LSASS memory was read on a host, and a service was then installed on that
  same host inside the hour. That pairing is the operator's loop: take the
  credentials, then use them to establish a foothold. Either half is worth a
  look; together they are hands-on-keyboard activity.
severity: critical
confidence: 80
risk_score: 95
status: enabled
version: 1
author: LUNATIC-IT Detection Engineering

window: 1h
correlate_by:
  - hostname
ordered: true

stages:
  - name: credential_dumping
    description: WIN-003 fired on this host
    matches: detection
    conditions:
      field: detection.rule_id
      operator: equals
      value: WIN-003

  - name: persistence_or_movement
    description: a service was installed, or a remote logon followed
    conditions:
      any:
        - field: event_code
          operator: equals
          value: "7045"
        - field: detection.rule_id
          operator: equals
          value: WIN-006
        - all:
            - field: event_code
              operator: equals
              value: "4624"
            - field: authentication.logon_type
              operator: equals
              value: "3"

suppression: 2h

mitre_attack:
  - T1003.001
  - T1543.003
  - T1021

false_positive_notes: >-
  A support engineer collecting a crash dump on a server that also receives
  routine software installations can produce both halves within an hour.
  Check the account behind each stage: the same non-administrative account
  doing both is the serious case. Note this chain is keyed on hostname, so
  two unrelated administrators working on one busy server can also pair up —
  read the timeline before assuming one actor.
investigation_steps: >-
  1. Establish who ran the dumping command and whether a support case exists.
  2. Inspect the installed service's binary path and signature, or the
  remote logon's source address.
  3. Assume every credential cached on the host is known to the attacker and
  enumerate the privileged sessions that were open.
  4. Contain the host and begin credential rotation; do not wait for
  confirmation of exfiltration.
references:
  - https://attack.mitre.org/techniques/T1003/001/
