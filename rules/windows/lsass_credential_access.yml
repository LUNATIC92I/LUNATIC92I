rule_id: WIN-003
name: LSASS memory dumping indicators
description: >-
  A command line that references lsass together with a known dumping
  mechanism (procdump, comsvcs.dll MiniDump, rundll32, taskmgr-style dump
  helpers). Reading LSASS memory is how an attacker turns one host into
  domain credentials, and it is a step almost every hands-on-keyboard
  intrusion takes.
severity: critical
confidence: 85
risk_score: 90
status: enabled
version: 1
author: LUNATIC-IT Detection Engineering

conditions:
  all:
    - field: command_line
      operator: contains
      value: lsass
    - any:
        - field: command_line
          operator: contains
          value: procdump
        - field: command_line
          operator: contains
          value: comsvcs.dll
        - field: command_line
          operator: contains
          value: MiniDump
        - field: command_line
          operator: contains
          value: rundll32
        - field: command_line
          operator: contains
          value: -ma

suppress_by:
  - hostname
suppression: 30m

mitre_attack:
  - T1003
  - T1003.001

false_positive_notes: >-
  Legitimate crash-dump collection by a support engineer or an EDR/AV
  product can produce a matching command line. The distinguishing questions
  are who ran it, whether a support case exists, and where the resulting
  dump file went. Treat a match as an incident until one of those answers
  is satisfactory. Note this rule sees only command lines: a dumper that
  calls the API directly, without touching a command line, is not covered
  here and needs process-access telemetry (Sysmon event 10).
investigation_steps: >-
  1. Determine the user and parent process, and whether the account is an
  administrator.
  2. Locate the dump file on disk and whether it was moved, compressed, or
  exfiltrated.
  3. Assume every credential cached on that host is now known: enumerate
  logon sessions on the host and identify privileged ones.
  4. Contain the host and begin credential rotation for the affected
  accounts — do not wait for confirmation of exfiltration.
references:
  - https://attack.mitre.org/techniques/T1003/001/
